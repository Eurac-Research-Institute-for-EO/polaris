site_name: Polaris Documentation
site_description: Eurac EO Argo CD cluster configuration and application deployments
docs_dir: docs/wiki
site_dir: site

theme:
    name: material
    palette:
        - scheme: default
          toggle:
              icon: material/toggle-switch
              name: Switch to dark mode

        - scheme: slate
          toggle:
              icon: material/toggle-switch-off-outline
              name: Switch to light mode
    features:
        - navigation.tabs
        - navigation.top
        - navigation.indexes
        - navigation.instant
        - navigation.footer
        - search.highlight
        - search.suggest
        - toc.integrate
        - content.code.annotate
        - content.code.copy
        - content.code.fold

nav:
    - Home: index.md
    - Deployment:
          - deployment.md
          - Single Node:
                - single-node.md
                - Installation: installation.md
                - Secrets: secrets.md
                - Uninstall: uninstall.md
          - Multinode:
                - multinode/multinode.md
                - Prerequisites: multinode/prerequisites.md
                - SSH & Deployment User: multinode/deployment-user.md
                - Configuration: multinode/configuration.md
                - Secrets: multinode/secrets.md
                - Deploy & Verify: multinode/deployment.md
                - Operations: multinode/operations.md
                - Troubleshooting: multinode/troubleshooting.md

plugins:
    - search
    - git-revision-date-localized:
          type: date
          enable_creation_date: false
          fallback_to_build_date: true

markdown_extensions:
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.superfences
    - pymdownx.snippets
    - admonition
    - pymdownx.details
