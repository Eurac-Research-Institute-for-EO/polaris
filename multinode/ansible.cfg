# Ansible configuration for the multinode setup. Picked up automatically when you
# run ansible-playbook from this directory (multinode/).

[defaults]
interpreter_python = auto_silent

# The k3s install tasks intentionally pipe the official installer
# (`curl -sfL https://get.k3s.io | sh`); get_url/uri can't replicate a piped
# shell installer cleanly, so silence the "consider using get_url or uri" hint
# for command/shell tasks.
command_warnings = False
