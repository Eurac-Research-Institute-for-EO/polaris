[all_nodes:vars]
# Steady-state user for all playbooks: the deployment user (polaris).
# bootstrap_user.yaml creates it, connecting as the initial user (config.yaml:
# initial_user) only for its first play — no need to change this value.
ansible_user=polaris
ansible_ssh_private_key_file=~/.ssh/id_ed_polaris

[control:vars]
node_role=master

[workers:vars]
node_role=worker
