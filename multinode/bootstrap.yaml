# Ansible playbook to bootstrap a 3-node K3s cluster (1 master, 2 workers) with ArgoCD.
#
# Usage:
#   1. Edit inventory.ini with your node IPs
#   2. Edit vars/config.yaml with your cluster settings
#   3. Run: ansible-playbook -i inventory.ini bootstrap.yaml

- name: Setup system dependencies on all nodes
  hosts: all_nodes
  become: true
  vars:
      PLAYBOOK_VERSION: "0.1"
  tasks:
      - name: Install system dependencies
        ansible.builtin.include_tasks:
            file: tasks/system.yaml

- name: Setup K3s master node
  hosts: control
  become: true
  vars_files:
      - vars/config.yaml
  vars:
      PLAYBOOK_VERSION: "0.1"
      K3S_VERSION: "v1.35.0+k3s3"
      ARGOCD_VERSION: "9.4.0"
      HELM_VERSION: "v4.1.1"
      kubeconfig_path: /etc/rancher/k3s/k3s.yaml
  tasks:
      - name: Install k3s server
        ansible.builtin.include_tasks:
            file: tasks/master/k3s_master.yaml
      - name: Install Helm
        ansible.builtin.include_tasks:
            file: tasks/master/helm.yaml
      - name: Install ArgoCD
        ansible.builtin.include_tasks:
            file: tasks/master/argocd.yaml

- name: Setup K3s worker nodes
  hosts: workers
  become: true
  vars:
      K3S_VERSION: "v1.35.0+k3s3"
      master_ip: "{{ hostvars[groups['control'][0]]['ansible_host'] | default(groups['control'][0]) }}"
      k3s_token: "{{ hostvars[groups['control'][0]]['k3s_node_token'].stdout }}"
  tasks:
      - name: Install k3s agent and join cluster
        ansible.builtin.include_tasks:
            file: tasks/worker/k3s_worker.yaml
