# Multinode secrets — copy to secrets.yaml (gitignored) and fill in real values:
#   cd multinode
#   cp vars/secrets.example.yaml vars/secrets.yaml
#   $EDITOR vars/secrets.yaml
#
# secrets.yaml is loaded by tasks/master/argocd/install.yaml (when
# argocd.oidc.enabled is true) and by tasks/master/secrets.yaml. Keep it out of git.

# Keycloak OIDC client secret for the ArgoCD client (config.yaml: argocd.oidc.client_id).
oidc_client_secret: "CHANGEME"

# SSH private key (OpenSSH PEM) ArgoCD Image Updater uses to push image-tag bumps
# back to the polaris-apps repo (git write-back). Generate a DEDICATED keypair and
# register the PUBLIC key as a deploy key WITH WRITE ACCESS on polaris-apps:
#   ssh-keygen -t ed25519 -C polaris-image-updater -f ./iu_key -N ""
#   gh repo deploy-key add ./iu_key.pub \
#       -R Eurac-Research-Institute-for-EO/polaris-apps -w -t image-updater
# Then paste the PRIVATE key (contents of ./iu_key) below as a block scalar, e.g.:
#   image_updater_git_ssh_key: |
#     -----BEGIN OPENSSH PRIVATE KEY-----
#     ...
#     -----END OPENSSH PRIVATE KEY-----
# Consumed by tasks/master/secrets.yaml -> secret argocd/polaris-apps-image-updater,
# referenced by the openeo Applications via
# write-back-method: git:secret:argocd/polaris-apps-image-updater.
# Leave empty to skip the secret (git write-back stays off until you fill it in).
image_updater_git_ssh_key: ""

# Infrastructure Manager (IM) secrets, consumed by tasks/master/im.yaml. Kept in a
# SEPARATE top-level key from the config.yaml `im:` block (different files; same key
# name would collide when both are loaded). Only used when im.enabled is true.
im_secrets:
    # Keycloak OIDC client secret for the IM dashboard client (config.yaml:
    # im.oidc.client_id = polaris_im). Create the confidential client in Keycloak.
    oidc_client_secret: "CHANGEME"
    # Fernet key IM uses to encrypt stored cloud credentials in its database.
    # Generate a fresh one — do NOT reuse the chart's shared default:
    #   openssl rand -base64 32
    credentials_key: "CHANGEME"

# Application secrets, consumed by tasks/master/secrets.yaml. Each plain Secret is
# applied to its namespace BEFORE argocd syncs the apps repo, so each app finds the
# secret it references by name on first sync. Every block is optional — drop one to
# skip creating its secrets (e.g. keep only `grafana` to ship monitoring alone).
secrets:
    # monitoring/grafana-credentials — kube-prometheus-stack grafana
    # (existingSecret: grafana-credentials; keys admin-user, admin-password,
    #  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET).
    grafana:
        admin_user: "admin"
        admin_password: "CHANGEME"
        # Keycloak client secret for the Grafana OIDC client (separate from argocd's).
        oidc_client_secret: "CHANGEME"

    # keycloak/keycloak-credentials + keycloak/postgresql-credentials.
    keycloak:
        admin_user: "admin"
        admin_password: "CHANGEME"
        db_name: "keycloak"
        db_username: "keycloak"
        db_password: "CHANGEME"
        db_host: "postgresql.keycloak.svc.cluster.local"
        db_port: 5432

    # openeo: db_password becomes the postgres-password key of the per-release
    # secret <release>-postgresql (openeo-dev-postgresql / openeo-postgresql),
    # which the chart consumes via postgresql.auth.existingSecret. db_name/
    # db_username are informational only — the chart sets those from its own
    # postgresql.auth values, not from this secret.
    openeo:
        db_name: "postgres"
        db_username: "postgres"
        db_password: "CHANGEME"
        # Redis runs without auth in the current chart (it never injects
        # REDIS_PASSWORD into the pods), so leave this empty to skip the no-op
        # openeo-redis secret. Only set it once the chart wires Redis auth.
        redis_password: ""
        # openeo-s3-credentials — S3 object store for job result storage. The
        # chart consumes this secret (name overridable via s3.secretName) when
        # s3.enabled is true, reading exactly these keys: endpoint_url, bucket,
        # access_key, secret_key. The block is gated on a non-empty access_key,
        # so with these empty defaults the secret is skipped — fill them in (and
        # flip s3.enabled to true in the chart values) to enable result upload.
        s3:
            endpoint_url: ""
            bucket: ""
            access_key: ""
            secret_key: ""
