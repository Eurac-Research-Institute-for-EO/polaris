# Multinode secrets — copy to secrets.yaml (gitignored) and fill in real values:
#   cd multinode
#   cp vars/secrets.example.yaml vars/secrets.yaml
#   $EDITOR vars/secrets.yaml
#
# secrets.yaml is loaded by tasks/master/argocd/install.yaml (when
# argocd.oidc.enabled is true) and by tasks/master/secrets.yaml. Keep it out of git.

# Keycloak OIDC client secret for the ArgoCD client (config.yaml: argocd.oidc.client_id).
oidc_client_secret: "CHANGEME"

# Application secrets, consumed by tasks/master/secrets.yaml. Each plain Secret is
# applied to its namespace BEFORE argocd syncs the apps repo, so each app finds the
# secret it references by name on first sync. Every block is optional — drop one to
# skip creating its secrets (e.g. keep only `grafana` to ship monitoring alone).
secrets:
    # monitoring/grafana-credentials — kube-prometheus-stack grafana
    # (existingSecret: grafana-credentials; keys admin-user, admin-password,
    #  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET).
    grafana:
        admin_user: "admin"
        admin_password: "CHANGEME"
        # Keycloak client secret for the Grafana OIDC client (separate from argocd's).
        oidc_client_secret: "CHANGEME"

    # keycloak/keycloak-credentials + keycloak/postgresql-credentials.
    keycloak:
        admin_user: "admin"
        admin_password: "CHANGEME"
        db_name: "keycloak"
        db_username: "keycloak"
        db_password: "CHANGEME"
        db_host: "postgresql.keycloak.svc.cluster.local"
        db_port: 5432

    # openeo: db_password becomes the postgres-password key of the per-release
    # secret <release>-postgresql (openeo-dev-postgresql / openeo-postgresql),
    # which the chart consumes via postgresql.auth.existingSecret. db_name/
    # db_username are informational only — the chart sets those from its own
    # postgresql.auth values, not from this secret.
    openeo:
        db_name: "postgres"
        db_username: "postgres"
        db_password: "CHANGEME"
        # Redis runs without auth in the current chart (it never injects
        # REDIS_PASSWORD into the pods), so leave this empty to skip the no-op
        # openeo-redis secret. Only set it once the chart wires Redis auth.
        redis_password: ""
