# Install k3s server on the master node and expose the join token for workers.
- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
      path: /etc/rancher/k3s
      state: directory
      mode: "0755"
      owner: root
      group: root

- name: Write k3s config.yaml
  ansible.builtin.copy:
      content: |
          write-kubeconfig-mode: "0644"
      dest: /etc/rancher/k3s/config.yaml
      mode: "0644"
      owner: root
      group: root

- name: Check if k3s is already installed
  ansible.builtin.stat:
      path: /usr/local/bin/k3s
  register: k3s_binary

- name: Check k3s version if installed
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_version_output
  changed_when: false
  failed_when: false
  when: k3s_binary.stat.exists

- name: Install k3s server
  ansible.builtin.shell: |
      curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ K3S_VERSION }}" sh -
  when: not k3s_binary.stat.exists or K3S_VERSION not in k3s_version_output.stdout
  register: k3s_install
  changed_when: k3s_install.rc == 0

- name: Wait for k3s to be ready
  ansible.builtin.wait_for:
      path: /etc/rancher/k3s/k3s.yaml
      state: present
      timeout: 300

- name: Ensure kubeconfig is readable
  ansible.builtin.file:
      path: /etc/rancher/k3s/k3s.yaml
      mode: "0644"
      owner: root
      group: root

- name: Fetch node token for workers
  ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token
  changed_when: false

- name: Wait for master node to be Ready
  ansible.builtin.command: |
      kubectl wait --for=condition=Ready node/{{ ansible_hostname }} --timeout=120s
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
