# Create the application Secrets the apps repo expects to already exist.
#
# These are plain Kubernetes Secrets (base64 in etcd, like any Secret — the
# sealed-secrets controller would unseal to the exact same thing). We apply them
# imperatively from vars/secrets.yaml so they exist BEFORE argocd syncs the apps
# repo; each app then references its secret by name (e.g. monitoring/grafana via
# existingSecret: grafana-credentials) and "autofinds" it on first sync.
#
# Values live in vars/secrets.yaml (gitignored). See vars/secrets.example.yaml.
# Every block is optional: a section only runs if it is present under `secrets:`,
# so you can ship monitoring alone by filling in only `secrets.grafana`.

- name: Check secrets file exists
  ansible.builtin.stat:
      path: "{{ playbook_dir }}/../vars/secrets.yaml"
  register: cluster_secrets_file
  delegate_to: localhost
  become: false

- name: Fail if secrets file is missing
  ansible.builtin.fail:
      msg: |
          vars/secrets.yaml was not found.

          Create it from the template and fill in the values:
            cd multinode
            cp vars/secrets.example.yaml vars/secrets.yaml
            $EDITOR vars/secrets.yaml
  when: not cluster_secrets_file.stat.exists

- name: Load secrets
  ansible.builtin.include_vars:
      file: "{{ playbook_dir }}/../vars/secrets.yaml"
  no_log: true

# -- Grafana / monitoring -------------------------------------------------------
- name: Create monitoring namespace
  ansible.builtin.shell: |
      kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: monitoring_ns
  changed_when: "'created' in monitoring_ns.stdout"
  when: secrets.grafana is defined

- name: Create grafana-credentials secret
  ansible.builtin.shell: |
      kubectl create secret generic grafana-credentials \
        --namespace=monitoring \
        --from-literal=admin-user="${ADMIN_USER}" \
        --from-literal=admin-password="${ADMIN_PASSWORD}" \
        --from-literal=GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET="${OIDC_CLIENT_SECRET}" \
        --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
      ADMIN_USER: "{{ secrets.grafana.admin_user }}"
      ADMIN_PASSWORD: "{{ secrets.grafana.admin_password }}"
      OIDC_CLIENT_SECRET: "{{ secrets.grafana.oidc_client_secret }}"
  register: grafana_secret
  changed_when: "'created' in grafana_secret.stdout or 'configured' in grafana_secret.stdout"
  no_log: true
  when: secrets.grafana is defined

# -- Keycloak -------------------------------------------------------------------
- name: Create keycloak namespace
  ansible.builtin.shell: |
      kubectl create namespace keycloak --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: keycloak_ns
  changed_when: "'created' in keycloak_ns.stdout"
  when: secrets.keycloak is defined

- name: Create keycloak-credentials secret
  ansible.builtin.shell: |
      kubectl create secret generic keycloak-credentials \
        --namespace=keycloak \
        --from-literal=KEYCLOAK_ADMIN="${KEYCLOAK_ADMIN}" \
        --from-literal=KEYCLOAK_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}" \
        --from-literal=KC_DB_URL="jdbc:postgresql://${KC_DB_HOST}:${KC_DB_PORT}/${KC_DB_NAME}" \
        --from-literal=KC_DB_USERNAME="${KC_DB_USERNAME}" \
        --from-literal=KC_DB_PASSWORD="${KC_DB_PASSWORD}" \
        --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
      KEYCLOAK_ADMIN: "{{ secrets.keycloak.admin_user }}"
      KEYCLOAK_ADMIN_PASSWORD: "{{ secrets.keycloak.admin_password }}"
      KC_DB_HOST: "{{ secrets.keycloak.db_host }}"
      KC_DB_PORT: "{{ secrets.keycloak.db_port }}"
      KC_DB_NAME: "{{ secrets.keycloak.db_name }}"
      KC_DB_USERNAME: "{{ secrets.keycloak.db_username }}"
      KC_DB_PASSWORD: "{{ secrets.keycloak.db_password }}"
  register: keycloak_secret
  changed_when: "'created' in keycloak_secret.stdout or 'configured' in keycloak_secret.stdout"
  no_log: true
  when: secrets.keycloak is defined

- name: Create postgresql-credentials secret (keycloak database)
  ansible.builtin.shell: |
      kubectl create secret generic postgresql-credentials \
        --namespace=keycloak \
        --from-literal=POSTGRES_DB="${POSTGRES_DB}" \
        --from-literal=POSTGRES_USER="${POSTGRES_USER}" \
        --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
        --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
      POSTGRES_DB: "{{ secrets.keycloak.db_name }}"
      POSTGRES_USER: "{{ secrets.keycloak.db_username }}"
      POSTGRES_PASSWORD: "{{ secrets.keycloak.db_password }}"
  register: keycloak_pg_secret
  changed_when: "'created' in keycloak_pg_secret.stdout or 'configured' in keycloak_pg_secret.stdout"
  no_log: true
  when: secrets.keycloak is defined

# -- OpenEO ---------------------------------------------------------------------
# openeo is deployed via kustomize overlays (apps/kustomization.yaml), and each
# overlay targets its OWN namespace, not a shared "openeo":
#   dev overlay    -> openeo-dev   (active)
#   stable overlay -> openeo       (add this once the stable node is online)
# Every openeo Secret the chart expects (existingSecret references + the Argo SA
# token) must therefore be created in EACH deployed overlay's namespace, so we
# drive all of them off this one list. The credentials are shared across overlays
# (same secrets.openeo values); only the namespace differs.
- name: Define the openeo overlay namespaces
  ansible.builtin.set_fact:
      openeo_namespaces:
          # The overlay NAMESPACES (not the overlay names): the stable overlay
          # deploys into "openeo" (release "openeo"), the dev overlay into
          # "openeo-dev". Each entry must equal the overlay's namespace exactly,
          # because the per-release secret is built as "{{ item }}-postgresql" and
          # must match the chart's existingSecret (openeo-postgresql for stable,
          # openeo-dev-postgresql for dev).
          - openeo-dev
          - openeo
  when: secrets.openeo is defined

- name: Create openeo namespaces
  ansible.builtin.shell: |
      kubectl create namespace {{ item }} --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: openeo_ns
  changed_when: "'created' in openeo_ns.stdout"
  loop: "{{ openeo_namespaces }}"
  when: secrets.openeo is defined

# The openeo-argo chart (and its Bitnami postgresql subchart) both read the DB
# password from a Secret named "<release>-postgresql" under the Bitnami key
# "postgres-password". The release name equals the namespace in every overlay
# (openeo-dev -> openeo-dev, openeo -> openeo), so "{{ item }}-postgresql" is the
# exact name the chart looks up. POSTGRES_DB/USER are NOT taken from this secret —
# they come from the chart's postgresql.auth.{database,username} values — so we
# only need the password key here. The chart references this secret via
# postgresql.auth.existingSecret (base: openeo-postgresql; dev overlay patch:
# openeo-dev-postgresql).
- name: Create per-release openeo postgresql secret
  ansible.builtin.shell: |
      kubectl create secret generic {{ item }}-postgresql \
        --namespace={{ item }} \
        --from-literal=postgres-password="${POSTGRES_PASSWORD}" \
        --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
      POSTGRES_PASSWORD: "{{ secrets.openeo.db_password }}"
  register: openeo_pg_secret
  changed_when: "'created' in openeo_pg_secret.stdout or 'configured' in openeo_pg_secret.stdout"
  no_log: true
  loop: "{{ openeo_namespaces }}"
  when: secrets.openeo is defined

# NOTE: currently a no-op. The openeo-argo chart never injects REDIS_PASSWORD into
# the API/worker/cronjob pods and runs Redis with auth disabled, so nothing reads
# this secret. It is gated on a non-empty secrets.openeo.redis_password and the
# example ships it empty, so by default this task is skipped. Leave it here so that
# if the chart later wires Redis auth, only redis_password needs to be filled in.
- name: Create openeo-redis secret
  ansible.builtin.shell: |
      kubectl create secret generic openeo-redis \
        --namespace={{ item }} \
        --from-literal=REDIS_PASSWORD="${REDIS_PASSWORD}" \
        --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
      REDIS_PASSWORD: "{{ secrets.openeo.redis_password }}"
  register: openeo_redis_secret
  changed_when: "'created' in openeo_redis_secret.stdout or 'configured' in openeo_redis_secret.stdout"
  no_log: true
  loop: "{{ openeo_namespaces }}"
  when:
      - secrets.openeo is defined
      - secrets.openeo.redis_password is defined
      - secrets.openeo.redis_password | length > 0

# openeo-s3-credentials — S3 object store for job result storage. The chart wires
# these keys into the API/worker pods (S3_ENDPOINT_URL/S3_BUCKET/S3_ACCESS_KEY/
# S3_SECRET_KEY) from a Secret it looks up by name (default openeo-s3-credentials,
# overridable via s3.secretName) when s3.enabled is true, reading the keys
# endpoint_url/bucket/access_key/secret_key. Like openeo-redis above this is gated
# on a non-empty value (access_key) and the example ships it empty, so by default
# the task is skipped; fill in secrets.openeo.s3 and set s3.enabled in the chart to
# turn on result upload.
- name: Create openeo-s3-credentials secret
  ansible.builtin.shell: |
      kubectl create secret generic openeo-s3-credentials \
        --namespace={{ item }} \
        --from-literal=endpoint_url="${ENDPOINT_URL}" \
        --from-literal=bucket="${BUCKET}" \
        --from-literal=access_key="${ACCESS_KEY}" \
        --from-literal=secret_key="${SECRET_KEY}" \
        --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
      ENDPOINT_URL: "{{ secrets.openeo.s3.endpoint_url | default('') }}"
      BUCKET: "{{ secrets.openeo.s3.bucket | default('') }}"
      ACCESS_KEY: "{{ secrets.openeo.s3.access_key }}"
      SECRET_KEY: "{{ secrets.openeo.s3.secret_key | default('') }}"
  register: openeo_s3_secret
  changed_when: "'created' in openeo_s3_secret.stdout or 'configured' in openeo_s3_secret.stdout"
  no_log: true
  loop: "{{ openeo_namespaces }}"
  when:
      - secrets.openeo is defined
      - secrets.openeo.s3 is defined
      - secrets.openeo.s3.access_key is defined
      - secrets.openeo.s3.access_key | length > 0

# The openeo-argo chart authenticates to the Argo API with a STATIC ServiceAccount
# token Secret it looks up by name: openeo-argo-access-sa.service-account-token.
# Since k8s 1.24 these are no longer auto-generated for a ServiceAccount, and the
# chart's own post-install Job hook that creates it loses the race with the API
# pod / reconcile cronjob, which then crash with:
#   Error: secret "openeo-argo-access-sa.service-account-token" not found
#
# We pre-create the (initially empty) token Secret so it exists BEFORE argocd
# syncs the app. The k8s token-controller fills in .data.token automatically once
# the matching ServiceAccount exists (the chart creates the SA via a pre-install
# hook). The SA name is hard-coded in the chart, so the Secret name is identical
# in every namespace.
- name: Create openeo-argo ServiceAccount token secret
  ansible.builtin.shell: |
      kubectl apply -n {{ item }} -f - <<'EOF'
      apiVersion: v1
      kind: Secret
      metadata:
        name: openeo-argo-access-sa.service-account-token
        annotations:
          kubernetes.io/service-account.name: openeo-argo-access-sa
      type: kubernetes.io/service-account-token
      EOF
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: openeo_argo_token
  changed_when: "'created' in openeo_argo_token.stdout or 'configured' in openeo_argo_token.stdout"
  loop: "{{ openeo_namespaces }}"
  when: secrets.openeo is defined

# -- ArgoCD Image Updater git write-back ----------------------------------------
# SSH deploy key Image Updater uses to push image-tag bumps back to polaris-apps.
# Created in the argocd namespace; the openeo Applications reference it via the
# annotation write-back-method: git:secret:argocd/polaris-apps-image-updater. The
# github.com host keys it needs come from argocd-ssh-known-hosts-cm (created by the
# argo-cd chart, auto-mounted by the image-updater chart), so no known_hosts here.
# Skipped unless image_updater_git_ssh_key is set in vars/secrets.yaml.
- name: Create ArgoCD Image Updater git write-back SSH secret
  ansible.builtin.shell: |
      kubectl create secret generic polaris-apps-image-updater \
        --namespace=argocd \
        --from-literal=sshPrivateKey="${SSH_KEY}" \
        --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
      SSH_KEY: "{{ image_updater_git_ssh_key }}"
  register: image_updater_git_secret
  changed_when: "'created' in image_updater_git_secret.stdout or 'configured' in image_updater_git_secret.stdout"
  no_log: true
  when:
      - image_updater_git_ssh_key is defined
      - image_updater_git_ssh_key | length > 0

- name: Display secrets summary
  ansible.builtin.debug:
      msg:
          - "Application secrets applied to the cluster:"
          - "{{ 'monitoring/grafana-credentials' if secrets.grafana is defined else 'monitoring/grafana-credentials (skipped)' }}"
          - "{{ 'keycloak/keycloak-credentials, keycloak/postgresql-credentials' if secrets.keycloak is defined else 'keycloak/* (skipped)' }}"
          - >-
              {{ 'openeo (' ~ (openeo_namespaces | join(', ')) ~ '): openeo-postgresql, openeo-redis,
              openeo-s3-credentials, openeo-argo-access-sa.service-account-token' if secrets.openeo is defined else 'openeo/* (skipped)' }}
          - >-
              {{ 'argocd/polaris-apps-image-updater (git write-back SSH key)'
              if (image_updater_git_ssh_key | default('') | length > 0)
              else 'argocd/polaris-apps-image-updater (skipped — no image_updater_git_ssh_key)' }}
