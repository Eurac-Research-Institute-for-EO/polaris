# System package dependencies installed on every node (master and workers).
# Included by playbooks/deploy.yaml for the all_nodes play, alongside dns.yaml.
- name: Ping the host to check connectivity
  ansible.builtin.ping:

# VM-image-specific cleanup: a malformed duplicate apt source on the base image.
# Harmless to run if the file is already absent.
- name: Remove duplicate Microsoft repository file
  ansible.builtin.file:
      path: /etc/apt/sources.list.d/microsoft-prod.list.list
      state: absent

- name: Install generic dependencies
  ansible.builtin.apt:
      name:
          - curl
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - jq
      state: present
      update_cache: true
