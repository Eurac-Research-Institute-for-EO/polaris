# ArgoCD Configuration for Polaris Cluster
#
# NOTE: ArgoCD is now managed via Helm in ansible/tasks/argocd.yaml
#
# Access via: http://argocd.10.8.244.214.nip.io
---
# Reference: AppProject for Polaris
# Applied by: ansible/tasks/argo_github_auth.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
    name: polaris
    namespace: argocd
spec:
    description: Polaris Work Cluster Applications
    sourceRepos:
        - "https://github.com/Eurac-Research-Institute-for-EO/polaris"
    destinations:
        - namespace: "*"
          server: https://kubernetes.default.svc
    clusterResourceWhitelist:
        - group: "*"
          kind: "*"
---
# Reference: Root Application (App of Apps pattern)
# Applied by: ansible/tasks/argo_github_auth.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: polaris-apps
    namespace: argocd
    finalizers:
        - resources-finalizer.argocd.argoproj.io
spec:
    project: polaris
    source:
        repoURL: https://github.com/Eurac-Research-Institute-for-EO/polaris
        targetRevision: main
        path: apps
    destination:
        server: https://kubernetes.default.svc
        namespace: argocd
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
