# Ansible playbook to manage cluster secrets only.
#
# Use this instead of bootstrap.yaml when you only need to rotate or update secrets.
# This does NOT touch k3s, ArgoCD, Helm, Sealed Secrets controller, or any other
# cluster infrastructure - only the secrets themselves are created/updated.
#
# Usage:
#   ansible-playbook -i inventory secrets.yaml
#
# After running, pods that mount updated secrets will need to be restarted to
# pick up the new values. You can do this per-app with:
#   kubectl rollout restart deployment/monitoring-grafana -n monitoring
#   kubectl rollout restart deployment/keycloak -n keycloak
#   kubectl rollout restart deployment/openeo-openeo-argo -n openeo
#
- name: Update Polaris Cluster Secrets
  hosts: polaris
  become: true
  vars_files:
      - vars/cluster_secrets.yaml
  vars:
      kubeconfig_path: /etc/rancher/k3s/k3s.yaml
  tasks:
      - name: Load cluster configuration
        ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/vars/cluster_secrets.yaml"
            name: config
        no_log: true

      - name: Display update summary
        ansible.builtin.debug:
            msg:
                - "Updating secrets for cluster: {{ config.cluster.name }} ({{ config.cluster.environment }})"
                - "Domain: {{ config.cluster.domain }}"
                - "This playbook only touches secrets - no infrastructure changes."

      - name: Process cluster secrets
        ansible.builtin.include_tasks:
            file: tasks/cluster_secrets.yaml

      - name: Remind to restart affected pods
        ansible.builtin.debug:
            msg:
                - "Secrets updated. Pods will NOT automatically pick up changes."
                - "Restart affected deployments to apply new secret values:"
                - "  kubectl rollout restart deployment/monitoring-grafana -n monitoring"
                - "  kubectl rollout restart deployment/keycloak -n keycloak"
                - "  kubectl rollout restart deployment/openeo-openeo-argo -n openeo"
