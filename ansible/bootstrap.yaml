# Ansible playbook to bootstrap the Polaris cluster with k3s, ArgoCD, and Sealed Secrets.
- name: Setup Polaris Cluster
  hosts: polaris
  become: true
  vars:
    K3S_VERSION: "v1.35.0+k3s3"
    ARGOCD_VERSION: "v2.3.0"
    HELM_VERSION: "v4.1.1"
    SEALED_SECRETS_VERSION: "v0.34.0"
    github_oauth_client_id: !vault |
      $ANSIBLE_VAULT;1.1;AES256...
    github_oauth_client_secret: !vault |
      $ANSIBLE_VAULT;1.1;AES256...
  tasks:
    - name: Ping the host to check connectivity
      ansible.builtin.ping:

    - name: Print debug message to verify task execution
      ansible.builtin.debug:
        msg: Hello Polaris!

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install generic dependencies
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
        - curl
        - apt-transport-https
        - ca-certificates
        - software-properties-common

    - name: Install k3s
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ K3S_VERSION }}" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for k3s to be ready
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        state: present
        timeout: 300

    - name: Install Helm
      ansible.builtin.shell: |
        curl -sSL https://get.helm.sh/helm-{{ HELM_VERSION }}-linux-amd64.tar.gz | tar xz -C /tmp
        mv /tmp/linux-amd64/helm /usr/local/bin/helm
      args:
        creates: /usr/local/bin/helm

    - name: Install kubeseal CLI
      ansible.builtin.shell: |
        wget https://github.com/bitnami-labs/sealed-secrets/releases/download/{{ SEALED_SECRETS_VERSION }}/kubeseal-{{ SEALED_SECRETS_VERSION }}-linux-amd64.tar.gz
        tar xfz kubeseal-{{ SEALED_SECRETS_VERSION }}-linux-amd64.tar.gz -C /usr/local/bin
        chmod +x /usr/local/bin/kubeseal
      args:
        creates: /usr/local/bin/kubeseal

    - name: Add Sealed Secrets Helm repo
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
        helm repo update

    - name: Install Sealed Secrets controller
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets \
        --namespace kube-system \
        --version {{ SEALED_SECRETS_VERSION }}

    - name: Wait for Sealed Secrets controller
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        kubectl wait --for=condition=available --timeout=300s deployment/sealed-secrets -n kube-system

    - name: Create ArgoCD namespace
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

    - name: Install ArgoCD base
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ ARGOCD_VERSION }}/manifests/install.yaml

    - name: Wait for ArgoCD to be ready
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd

    - name: Create and seal GitHub OAuth secret
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        kubectl create secret generic github-oauth \
          --namespace=argocd \
          --from-literal=dex.github.clientID="{{ github_oauth_client_id }}" \
          --from-literal=dex.github.clientSecret="{{ github_oauth_client_secret }}" \
          --dry-run=client -o yaml | \
        kubeseal --format=yaml --controller-namespace=kube-system | \
        kubectl apply -f -

    - name: Copy ArgoCD custom manifests to target
      ansible.builtin.copy:
        src: ../argocd/
        dest: /tmp/argocd-custom/

    - name: Apply ArgoCD customizations from repo
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        kubectl apply -f /tmp/argocd-custom/deployment.yaml
