# Ansible playbook to bootstrap the Polaris cluster with k3s, ArgoCD, and Sealed Secrets.
- name: Setup Polaris Cluster
  hosts: polaris
  become: true
  vars_files:
      - vars/keycloak_secrets.yaml
  vars:
      PLAYBOOK_VERSION: "1.2"
      K3S_VERSION: "v1.35.0+k3s3"
      ARGOCD_VERSION: "9.4.0"
      HELM_VERSION: "v4.1.1"
      SEALED_SECRETS_VERSION: "v0.34.0"
      SEALED_SECRETS_DOWNLOAD: "0.34.0"
      kubeconfig_path: /etc/rancher/k3s/k3s.yaml
  tasks:
      - name: Install system dependencies
        ansible.builtin.include_tasks:
            file: tasks/system_deps.yaml
      - name: Install k3s
        ansible.builtin.include_tasks:
            file: tasks/k3s.yaml
      - name: Configure storage classes
        ansible.builtin.include_tasks:
            file: tasks/storageclass.yaml
      - name: Configure CoreDNS
        ansible.builtin.include_tasks:
            file: tasks/coredns.yaml
      - name: Install Helm
        ansible.builtin.include_tasks:
            file: tasks/helm.yaml
      - name: Install Sealed Secrets
        ansible.builtin.include_tasks:
            file: tasks/sealed_secrets.yaml
      - name: Install ArgoCD
        ansible.builtin.include_tasks:
            file: tasks/argocd.yaml
      - name: Create ArgoCD projects and applications
        ansible.builtin.include_tasks:
            file: tasks/argocd_project.yaml
