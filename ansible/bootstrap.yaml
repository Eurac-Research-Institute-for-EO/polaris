  tasks:
      - name: Install system dependencies
        ansible.builtin.include_tasks:
            file: tasks/system_deps.yaml
      - name: Install k3s
        ansible.builtin.include_tasks:
            file: tasks/k3s.yaml
      - name: Configure CoreDNS
        ansible.builtin.include_tasks:
            file: tasks/coredns.yaml
      - name: Install Helm
        ansible.builtin.include_tasks:
            file: tasks/helm.yaml
      - name: Install Sealed Secrets
        ansible.builtin.include_tasks:
            file: tasks/sealed_secrets.yaml
      - name: Install ArgoCD
        ansible.builtin.include_tasks:
            file: tasks/argocd.yaml
      - name: Configure ArgoCD with GitHub OAuth
        ansible.builtin.include_tasks:
            file: tasks/argo_github_auth.yaml
