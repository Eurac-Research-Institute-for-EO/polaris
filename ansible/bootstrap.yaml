# Ansible playbook to bootstrap the Polaris cluster with k3s, ArgoCD, and Sealed Secrets.
- name: Setup Polaris Cluster
  hosts: polaris
  become: true
  vars:
      PLAYBOOK_VERSION: "1.1"
      # Versions of the software components to be installed
      K3S_VERSION: "v1.35.0+k3s3"
      ARGOCD_VERSION: "9.4.0"
      HELM_VERSION: "v4.1.1"
      SEALED_SECRETS_VERSION: "v0.34.0"
      SEALED_SECRETS_DOWNLOAD: "0.34.0"
      kubeconfig_path: /etc/rancher/k3s/k3s.yaml
      # Argo CD user setup
      # GitHub org receives READONLY by default
      ARGOCD_ADMINS:
          - juro.zvolensky@gmail.com
          - yuvvraaj0flying@gmail.com
      GITHUB_ORGANIZATION: Eurac-Research-Institute-for-EO
      # GitHub OAuth credentials for ArgoCD (stored securely in Ansible Vault)
      github_oauth_client_id: !vault |
