# Ansible tasks for installing Sealed Secrets
- name: Check if kubeseal is already installed
  ansible.builtin.stat:
      path: /usr/local/bin/kubeseal
  register: kubeseal_binary

- name: Download and extract kubeseal
  ansible.builtin.unarchive:
      src: "https://github.com/bitnami-labs/sealed-secrets/releases/download/{{ SEALED_SECRETS_VERSION }}/kubeseal-{{ SEALED_SECRETS_DOWNLOAD }}-linux-amd64.tar.gz"
      dest: /usr/local/bin
      remote_src: yes
      mode: "0755"
  when: not kubeseal_binary.stat.exists

- name: Add Sealed Secrets Helm repo
  ansible.builtin.shell: |
      export KUBECONFIG={{ kubeconfig_path }}
      helm repo list | grep -q sealed-secrets || helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
  register: helm_repo_add
  changed_when: "'has been added' in helm_repo_add.stdout or helm_repo_add.rc == 0"
  failed_when: helm_repo_add.rc != 0

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Install Sealed Secrets controller
  ansible.builtin.shell: |
      helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets \
        --namespace kube-system
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: sealed_secrets_install
  changed_when: "'has been upgraded' in sealed_secrets_install.stdout or 'has been installed' in sealed_secrets_install.stdout"

- name: Wait for Sealed Secrets controller
  ansible.builtin.command: |
      kubectl wait --for=condition=available --timeout=300s deployment/sealed-secrets -n kube-system
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
