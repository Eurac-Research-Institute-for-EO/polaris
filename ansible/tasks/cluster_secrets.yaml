# Ansible tasks for managing cluster secrets

- name: Check if cluster config exists
  ansible.builtin.stat:
      path: "{{ playbook_dir }}/vars/cluster_secrets.yaml"
  register: config_file
  delegate_to: localhost

- name: Fail if config doesn't exist
  ansible.builtin.fail:
      msg: |
          Configuration file not found at {{ playbook_dir }}/vars/cluster_secrets.yaml

          Please create it first:
            cd ansible
            cp vars/cluster_secrets.example.yaml vars/cluster_secrets.yaml
            vim vars/cluster_secrets.yaml  # Fill in all CHANGEME values
  when: not config_file.stat.exists

- name: Load cluster configuration
  ansible.builtin.include_vars:
      file: "{{ playbook_dir }}/vars/cluster_secrets.yaml"
      name: config
  no_log: true

- name: Display configuration summary
  ansible.builtin.debug:
      msg:
          - "Cluster: {{ config.cluster.name }} ({{ config.cluster.environment }})"
          - "Domain: {{ config.cluster.domain }}"
          - "ArgoCD OIDC: {{ 'enabled' if config.argocd.oidc.enabled else 'disabled' }}"

- name: Wait for sealed-secrets controller to be ready
  ansible.builtin.command: |
      kubectl wait --for=condition=available --timeout=300s deployment/sealed-secrets -n kube-system
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Create Keycloak namespace
  ansible.builtin.shell: |
      kubectl create namespace keycloak --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: keycloak_ns
  changed_when: "'created' in keycloak_ns.stdout"

- name: Generate Keycloak admin credentials sealed secret
  ansible.builtin.shell: |
      kubectl create secret generic keycloak-credentials \
        --namespace=keycloak \
        --from-literal=KEYCLOAK_ADMIN="{{ config.keycloak.admin.username }}" \
        --from-literal=KEYCLOAK_ADMIN_PASSWORD="{{ config.keycloak.admin.password }}" \
        --from-literal=KC_DB_URL="jdbc:postgresql://{{ config.keycloak.database.host }}:{{ config.keycloak.database.port }}/{{ config.keycloak.database.name }}" \
        --from-literal=KC_DB_USERNAME="{{ config.keycloak.database.username }}" \
        --from-literal=KC_DB_PASSWORD="{{ config.keycloak.database.password }}" \
        --dry-run=client -o yaml | \
      kubeseal --controller-namespace=kube-system --controller-name=sealed-secrets --format yaml \
        > /tmp/keycloak-credentials-sealed.yaml
      kubectl apply -f /tmp/keycloak-credentials-sealed.yaml
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: keycloak_secret
  changed_when: "'created' in keycloak_secret.stdout or 'configured' in keycloak_secret.stdout"
  no_log: true

- name: Generate PostgreSQL credentials for Keycloak sealed secret
  ansible.builtin.shell: |
      kubectl create secret generic postgresql-credentials \
        --namespace=keycloak \
        --from-literal=POSTGRES_DB="{{ config.keycloak.database.name }}" \
        --from-literal=POSTGRES_USER="{{ config.keycloak.database.username }}" \
        --from-literal=POSTGRES_PASSWORD="{{ config.keycloak.database.password }}" \
        --dry-run=client -o yaml | \
      kubeseal --controller-namespace=kube-system --controller-name=sealed-secrets --format yaml \
        > /tmp/postgresql-credentials-sealed.yaml
      kubectl apply -f /tmp/postgresql-credentials-sealed.yaml
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: postgres_secret
  changed_when: "'created' in postgres_secret.stdout or 'configured' in postgres_secret.stdout"
  no_log: true

- name: Create OpenEO namespace
  ansible.builtin.shell: |
      kubectl create namespace openeo --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: openeo_ns
  changed_when: "'created' in openeo_ns.stdout"

- name: Generate OpenEO database credentials sealed secret
  ansible.builtin.shell: |
      kubectl create secret generic openeo-postgresql \
        --namespace=openeo \
        --from-literal=POSTGRES_DB="{{ config.openeo.database.name }}" \
        --from-literal=POSTGRES_USER="{{ config.openeo.database.username }}" \
        --from-literal=POSTGRES_PASSWORD="{{ config.openeo.database.password }}" \
        --dry-run=client -o yaml | \
      kubeseal --controller-namespace=kube-system --controller-name=sealed-secrets --format yaml \
        > /tmp/openeo-postgresql-sealed.yaml
      kubectl apply -f /tmp/openeo-postgresql-sealed.yaml
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: openeo_db_secret
  changed_when: "'created' in openeo_db_secret.stdout or 'configured' in openeo_db_secret.stdout"
  no_log: true

- name: Generate OpenEO Redis credentials sealed secret
  ansible.builtin.shell: |
      kubectl create secret generic openeo-redis \
        --namespace=openeo \
        --from-literal=REDIS_PASSWORD="{{ config.openeo.redis.password }}" \
        --dry-run=client -o yaml | \
      kubeseal --controller-namespace=kube-system --controller-name=sealed-secrets --format yaml \
        > /tmp/openeo-redis-sealed.yaml
      kubectl apply -f /tmp/openeo-redis-sealed.yaml
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: openeo_redis_secret
  changed_when: "'created' in openeo_redis_secret.stdout or 'configured' in openeo_redis_secret.stdout"
  no_log: true
  when: config.openeo.redis.password is defined and config.openeo.redis.password != ""

- name: Create monitoring namespace
  ansible.builtin.shell: |
      kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: monitoring_ns
  changed_when: "'created' in monitoring_ns.stdout"

- name: Create Grafana credentials secret
  ansible.builtin.shell: |
      kubectl create secret generic grafana-credentials \
        --namespace=monitoring \
        --from-literal=admin-user="{{ config.grafana.admin.username }}" \
        --from-literal=admin-password="{{ config.grafana.admin.password }}" \
        --from-literal=GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET="{{ config.grafana.oidc.client_secret }}" \
        --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: grafana_secret
  changed_when: "'created' in grafana_secret.stdout or 'configured' in grafana_secret.stdout"
  no_log: true
  when: config.grafana is defined

- name: Set ArgoCD OIDC variables
  ansible.builtin.set_fact:
      keycloak_client_id: "{{ config.argocd.oidc.client_id }}"
      keycloak_client_secret: "{{ config.argocd.oidc.client_secret }}"
  no_log: true

- name: Clean up temporary files
  ansible.builtin.file:
      path: "{{ item }}"
      state: absent
  loop:
      - /tmp/keycloak-credentials-sealed.yaml
      - /tmp/postgresql-credentials-sealed.yaml
      - /tmp/openeo-postgresql-sealed.yaml
      - /tmp/openeo-redis-sealed.yaml
  delegate_to: localhost

- name: Display secrets generation summary
  ansible.builtin.debug:
      msg:
          - "Secrets generated successfully!"
          - "- Keycloak admin and database credentials"
          - "- OpenEO database and Redis credentials"
          - ""
          - "All secrets are sealed and applied to the cluster."
