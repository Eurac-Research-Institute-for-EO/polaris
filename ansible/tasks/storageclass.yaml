# Ansible tasks for configuring storage classes
# Note: local-path provisioner works best with WaitForFirstConsumer mode
# This may not be needed in the future but it doesnt hurt anything right now

- name: Wait for local-path storage class to be available
  ansible.builtin.command: kubectl get storageclass local-path
  register: storageclass_check
  retries: 30
  delay: 10
  until: storageclass_check.rc == 0
  changed_when: false
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"

- name: Check current volumeBindingMode for local-path storage class
  ansible.builtin.shell: |
      kubectl get storageclass local-path -o jsonpath='{.volumeBindingMode}'
  register: current_binding_mode
  changed_when: false
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"

- name: Display current storage class binding mode
  ansible.builtin.debug:
      msg: "Current volumeBindingMode: {{ current_binding_mode.stdout }}"

- name: Ensure local-path storage class uses WaitForFirstConsumer (if needed)
  ansible.builtin.shell: |
      if [ "{{ current_binding_mode.stdout }}" != "WaitForFirstConsumer" ]; then
        echo "Recreating storage class with WaitForFirstConsumer mode..."
        kubectl delete storageclass local-path
        cat <<EOF | kubectl apply -f -
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: local-path
          annotations:
            storageclass.kubernetes.io/is-default-class: "true"
        provisioner: rancher.io/local-path
        volumeBindingMode: WaitForFirstConsumer
        reclaimPolicy: Delete
      EOF
      else
        echo "Storage class already has correct volumeBindingMode"
      fi
  register: storageclass_update
  changed_when: "'Recreating storage class' in storageclass_update.stdout"
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"

- name: Verify storage class configuration
  ansible.builtin.command: kubectl get storageclass local-path -o yaml
  register: storageclass_info
  changed_when: false
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"

- name: Display storage class configuration summary
  ansible.builtin.debug:
      msg: |
          Storage class 'local-path' configured successfully:
          - volumeBindingMode: WaitForFirstConsumer (correct for local-path provisioner)

          Note: PVCs with WaitForFirstConsumer will remain Pending until a pod uses them.
          This is normal and expected behavior.
          ArgoCD will be configured to treat Pending PVCs as Healthy after installation.
