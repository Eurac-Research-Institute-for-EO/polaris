# Ansible tasks for installing ArgoCD with Keycloak OAuth integration
# Clean, reproducible flow:
# 1. Install ArgoCD with basic config via Helm
# 2. Configure Keycloak OAuth credentials in argocd-secret
# 3. Restart ArgoCD to apply OAuth configuration

- name: Create ArgoCD namespace
  ansible.builtin.shell: |
      kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: argocd_namespace
  changed_when: "'created' in argocd_namespace.stdout"

- name: Add ArgoCD Helm repository
  ansible.builtin.shell: |
      helm repo list | grep -q '^argo' || helm repo add argo https://argoproj.github.io/argo-helm
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: helm_argo_repo
  changed_when: "'has been added' in helm_argo_repo.stdout or helm_argo_repo.rc == 0"
  failed_when: helm_argo_repo.rc != 0

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Create ArgoCD Helm values file
  ansible.builtin.copy:
      content: |
          server:
            service:
              type: ClusterIP
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: web
              hostname: argocd.{{ config.cluster.domain }}

          configs:
            params:
              server.insecure: true
            cm:
              url: "http://argocd.{{ config.cluster.domain }}"
              oidc.config: |
                name: {{ config.argocd.oidc.name }}
                issuer: "{{ config.argocd.oidc.issuer }}"
                clientID: $oidc.keycloak.clientId
                clientSecret: $oidc.keycloak.clientSecret
                requestedScopes: {{ config.argocd.oidc.requested_scopes | to_json }}
                redirectURI: "http://argocd.{{ config.cluster.domain }}/auth/callback"
            rbac:
              policy.csv: |
                g, {{ config.argocd.rbac.admin_group }}, role:admin
              policy.default: {{ config.argocd.rbac.default_role }}
      dest: /tmp/argocd-values.yaml
      mode: "0644"

- name: Install ArgoCD via Helm
  ansible.builtin.shell: |
      helm upgrade --install argocd argo/argo-cd \
        --namespace argocd \
        --create-namespace \
        --version {{ ARGOCD_VERSION }} \
        --values /tmp/argocd-values.yaml
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: argocd_install
  changed_when: "'has been upgraded' in argocd_install.stdout or 'has been installed' in argocd_install.stdout"

- name: Wait for ArgoCD server to be ready
  ansible.builtin.command: |
      kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

# Configure Keycloak OAuth credentials
# We update argocd-secret after Helm installation to avoid conflicts
- name: Check if argocd-secret exists
  ansible.builtin.command: |
      kubectl get secret argocd-secret -n argocd
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: argocd_secret_check
  changed_when: false
  failed_when: false

- name: Update argocd-secret with Keycloak OAuth credentials
  ansible.builtin.shell: |
      kubectl get secret argocd-secret -n argocd -o json | \
      jq --arg clientId "{{ keycloak_client_id }}" \
         --arg clientSecret "{{ keycloak_client_secret }}" \
         '.data["oidc.keycloak.clientId"] = ($clientId | @base64) |
          .data["oidc.keycloak.clientSecret"] = ($clientSecret | @base64)' | \
      kubectl apply -f -
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: update_secret
  changed_when: "'configured' in update_secret.stdout"
  when: argocd_secret_check.rc == 0

- name: Restart ArgoCD server to apply OAuth configuration
  ansible.builtin.shell: |
      kubectl rollout restart deployment/argocd-server -n argocd
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: argocd_restart
  changed_when: true
  when: update_secret.changed

- name: Wait for ArgoCD server rollout to complete
  ansible.builtin.command: |
      kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  when: update_secret.changed

- name: Get ArgoCD admin password
  ansible.builtin.shell: |
      kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "N/A"
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: argocd_admin_password
  changed_when: false
  failed_when: false

- name: Configure ArgoCD to treat Pending PVCs as Healthy (for WaitForFirstConsumer)
  ansible.builtin.shell: |
      kubectl patch configmap argocd-cm -n argocd --type merge -p '
      {
        "data": {
          "resource.customizations.health.PersistentVolumeClaim": "hs = {}\nhs.status = \"Healthy\"\nhs.message = \"PVC is available\"\nif obj.status ~= nil then\n  if obj.status.phase ~= nil then\n    if obj.status.phase == \"Pending\" then\n      hs.status = \"Healthy\"\n      hs.message = \"PVC is pending (WaitForFirstConsumer)\"\n    end\n    if obj.status.phase == \"Bound\" then\n      hs.status = \"Healthy\"\n      hs.message = \"PVC is bound\"\n    end\n  end\nend\nreturn hs"
        }
      }'
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: argocd_pvc_patch
  changed_when: argocd_pvc_patch.rc == 0

- name: Restart ArgoCD application controller to apply PVC health check changes
  ansible.builtin.shell: |
      kubectl rollout restart statefulset argocd-application-controller -n argocd
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  when: argocd_pvc_patch.changed
  register: argocd_controller_restart
  changed_when: argocd_controller_restart.rc == 0
