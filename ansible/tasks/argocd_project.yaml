- name: Create ArgoCD AppProject manifest
  ansible.builtin.copy:
      content: |
          apiVersion: argoproj.io/v1alpha1
          kind: AppProject
          metadata:
            name: {{ argocd.project.name }}
            namespace: argocd
          spec:
            description: {{ argocd.project.description }}
            sourceRepos:
          {% for repo in argocd.project.source_repos %}
              - "{{ repo }}"
          {% endfor %}
            destinations:
          {% for dest in argocd.project.destinations %}
              - namespace: "{{ dest.namespace }}"
                server: {{ dest.server }}
          {% endfor %}
            clusterResourceWhitelist:
          {% for resource in argocd.project.cluster_resource_whitelist %}
              - group: "{{ resource.group }}"
                kind: "{{ resource.kind }}"
          {% endfor %}
      dest: /tmp/argocd-appproject.yaml
      mode: "0644"

- name: Create ArgoCD Application manifest (App of Apps)
  ansible.builtin.copy:
      content: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: {{ argocd.app_of_apps.name }}
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: {{ argocd.project.name }}
            source:
              repoURL: {{ argocd.app_of_apps.repo_url }}
              targetRevision: {{ argocd.app_of_apps.target_revision }}
              path: {{ argocd.app_of_apps.path }}
            destination:
              server: {{ argocd.project.destinations[0].server }}
              namespace: argocd
            syncPolicy:
              automated:
                prune: {{ argocd.app_of_apps.sync_policy.automated.prune | lower }}
                selfHeal: {{ argocd.app_of_apps.sync_policy.automated.self_heal | lower }}
              syncOptions:
          {% for option in argocd.app_of_apps.sync_policy.sync_options %}
                - {{ option }}
          {% endfor %}
      dest: /tmp/argocd-application.yaml
      mode: "0644"

- name: Apply ArgoCD AppProject
  ansible.builtin.shell: |
      kubectl apply -f /tmp/argocd-appproject.yaml
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: argocd_project
  changed_when: "'created' in argocd_project.stdout or 'configured' in argocd_project.stdout"

- name: Apply ArgoCD Application
  ansible.builtin.shell: |
      kubectl apply -f /tmp/argocd-application.yaml
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: argocd_app
  changed_when: "'created' in argocd_app.stdout or 'configured' in argocd_app.stdout"

- name: Extract repository owner and name from URL
  ansible.builtin.set_fact:
      repo_api_url: "{{ argocd.app_of_apps.repo_url | regex_replace('https://github.com/', 'https://api.github.com/repos/') }}"
  when: "'github.com' in argocd.app_of_apps.repo_url"

- name: Check GitHub repository accessibility
  ansible.builtin.uri:
      url: "{{ repo_api_url }}"
      method: GET
      status_code: [200, 404]
  register: repo_check
  delegate_to: localhost
  changed_when: false
  failed_when: false
  when: "'github.com' in argocd.app_of_apps.repo_url"

- name: Verify repository is public
  ansible.builtin.debug:
      msg: "WARNING: Repository appears to be private (status: {{ repo_check.status }}). ArgoCD may need repository credentials configured."
  when:
      - "'github.com' in argocd.app_of_apps.repo_url"
      - repo_check.status is defined
      - repo_check.status != 200

- name: Wait for {{ argocd.app_of_apps.name }} Application to initialize
  ansible.builtin.shell: |
      sleep 5
      kubectl get application {{ argocd.app_of_apps.name }} -n argocd -o jsonpath='{.status.sync.status}' || echo "pending"
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: app_sync_status
  changed_when: false
  failed_when: false
  retries: 3
  delay: 5

- name: Check if child applications were created
  ansible.builtin.shell: |
      kubectl get applications -n argocd --no-headers | wc -l
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: app_count
  changed_when: false

- name: Get all Applications status
  ansible.builtin.shell: |
      kubectl get applications -n argocd -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,REPO:.spec.source.repoURL --no-headers || echo "No applications found"
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: all_apps_status
  changed_when: false

- name: Get {{ argocd.app_of_apps.name }} sync condition details
  ansible.builtin.shell: |
      kubectl get application {{ argocd.app_of_apps.name }} -n argocd -o jsonpath='{.status.conditions}' 2>/dev/null || echo "No conditions"
  environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
  register: sync_conditions
  changed_when: false

- name: Display ArgoCD Application information
  ansible.builtin.debug:
      msg:
          - "ArgoCD Applications Deployment Status"
          - "Project: {{ argocd.project.name }}"
          - "App of Apps: {{ argocd.app_of_apps.name }}"
          - "Total Applications: {{ app_count.stdout }}"
          - ""
          - "Applications Status:"
          - "{{ all_apps_status.stdout_lines }}"
          - ""
          - "{{ argocd.app_of_apps.name }} Sync Status: {{ app_sync_status.stdout }}"
          - "Sync Conditions: {{ sync_conditions.stdout }}"
          - ""
