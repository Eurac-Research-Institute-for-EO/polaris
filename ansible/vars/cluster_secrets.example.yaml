# Polaris Cluster Configuration
# This file contains all cluster-wide configuration including secrets, OIDC settings, and application configs.

# CLUSTER SETTINGS
cluster:
    # Base domain for all services (using nip.io for local development)
    domain: "10.8.244.214.nip.io"

    # Kubernetes cluster name
    name: "polaris"

    # Environment (dev, staging, production)
    environment: "staging"

# KEYCLOAK (Identity Provider)
keycloak:
    # Keycloak admin credentials
    admin:
        username: "admin"
        password: "CHANGEME"

    # PostgreSQL database for Keycloak
    database:
        name: "keycloak"
        username: "keycloak"
        password: "CHANGEME"
        host: "postgresql.keycloak.svc.cluster.local"
        port: 5432

    # Keycloak realm and client configurations
    realm:
        name: "polaris"
        display_name: "Polaris Cluster"

    # External Keycloak configuration (if using external IdP)
    external:
        enabled: true
        url: "https://edp-portal.eurac.edu/auth/realms/edp"
        realm: "edp"

# ARGOCD (GitOps)
argocd:
    # ArgoCD admin password (auto-generated if not specified)
    admin_password: ""

    oidc:
        enabled: true
        name: "Keycloak"
        # Use external Keycloak
        issuer: "https://edp-portal.eurac.edu/auth/realms/edp"
        client_id: "CHANGEME" # Keycloak client ID for ArgoCD
        client_secret: "CHANGEME" # Keycloak client secret
        requested_scopes:
            - "openid"
            - "profile"
            - "email"
            - "groups"
    # RBAC Configuration
    rbac:
        # Keycloak group that gets admin access
        admin_group: "polaris_admins"
        # Default role for authenticated users
        default_role: "readonly"
        # Additional RBAC policies (CSV format)
        additional_policies: |
            p, role:developers, applications, *, */*, allow
            p, role:developers, repositories, *, *, allow
            g, polaris_developers, role:developers

# SEALED SECRETS
sealed_secrets:
    # Controller namespace
    namespace: "kube-system"

    # Certificate renewal (days)
    certificate_renewal_days: 30

# OPENEO
openeo:
    # PostgreSQL database
    database:
        name: "postgres"
        username: "postgres"
        password: "CHANGEME"
        size: "8Gi"

    # Redis cache
    redis:
        password: "CHANGEME"
        size: "8Gi"

    # OIDC Configuration
    oidc:
        enabled: true
        url: "https://edp-portal.eurac.edu/auth/realms/edp"
        organization: "eurac-keycloak"
        provider_title: "EURAC Keycloak"

    # API Configuration
    api:
        title: "OpenEO ArgoWorkflows"
        description: "A K8S deployment of the openeo api for argoworkflows."
        url: "http://openeo.10.8.244.214.nip.io/openeo/1.1.0"

    # STAC Catalogue
    stac:
        url: "https://stac.eodc.eu/api/v1"

    # Worker Configuration
    dask:
        worker_cores: "4"
        worker_memory: "8"
        worker_limit: "6"
        cluster_timeout: "3600"

# GRAFANA (Monitoring & Observability)
# Used by ansible/tasks/cluster_secrets.yaml to create the grafana-credentials K8s secret.
# That secret is consumed by kube-prometheus-stack (monitoring-app.yaml) with keys:
#   admin-user, admin-password, GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
grafana:
    # Fallback local login -- disable once Keycloak SSO is verified working
    admin:
        username: "admin"
        password: "CHANGEME"

    # OIDC Configuration for Keycloak SSO
    # Reuses a dedicated Keycloak client. Ensure the following are added to the
    # client's Valid Redirect URIs in Keycloak:
    #   - http://grafana.<domain>/login/generic_oauth
    #   - http://grafana.<domain>/*
    oidc:
        enabled: true
        name: "Keycloak"
        client_id: "CHANGEME" # Keycloak client ID for Grafana
        client_secret: "CHANGEME" # Keycloak client secret
        auth_url: "https://edp-portal.eurac.edu/auth/realms/edp/protocol/openid-connect/auth"
        token_url: "https://edp-portal.eurac.edu/auth/realms/edp/protocol/openid-connect/token"
        api_url: "https://edp-portal.eurac.edu/auth/realms/edp/protocol/openid-connect/userinfo"
        # 'groups' scope is required for Keycloak to include the groups claim in the JWT.
        # Ensure the Keycloak client has a 'Group Membership' mapper configured.
        scopes: "openid profile email groups"
        # Groups are sent without a leading slash (Full group path is OFF in the Keycloak mapper).
        admin_group: "polaris_admins"
        role_attribute_path: "contains(groups[*], 'polaris_admins') && 'Admin' || 'Viewer'"
        allow_sign_up: true
        use_pkce: true

    # Storage sizes for Loki (log persistence) and Grafana (dashboard/plugin persistence)
    storage:
        loki_size: "10Gi"
        grafana_size: "5Gi"
