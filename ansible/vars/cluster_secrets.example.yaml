# Polaris Cluster Configuration
# This file contains all cluster-wide configuration including secrets, OIDC settings, and application configs.

# CLUSTER SETTINGS
cluster:
    # Base domain for all services (using nip.io for local development)
    domain: "10.8.244.214.nip.io"

    # Kubernetes cluster name
    name: "polaris"

    # Environment (dev, staging, production)
    environment: "staging"

# KEYCLOAK (Identity Provider)
keycloak:
    # Keycloak admin credentials
    admin:
        username: "admin"
        password: "CHANGEME"

    # PostgreSQL database for Keycloak
    database:
        name: "keycloak"
        username: "keycloak"
        password: "CHANGEME"
        host: "postgresql.keycloak.svc.cluster.local"
        port: 5432

    # Keycloak realm and client configurations
    realm:
        name: "polaris"
        display_name: "Polaris Cluster"

    # External Keycloak configuration (if using external IdP)
    external:
        enabled: true
        url: "https://edp-portal.eurac.edu/auth/realms/edp"
        realm: "edp"

# ARGOCD (GitOps)
argocd:
    # ArgoCD admin password (auto-generated if not specified)
    admin_password: ""

    oidc:
        enabled: true
        name: "Keycloak"
        # Use external Keycloak
        issuer: "https://edp-portal.eurac.edu/auth/realms/edp"
        client_id: "CHANGEME" # Keycloak client ID for ArgoCD
        client_secret: "CHANGEME" # Keycloak client secret
        requested_scopes:
            - "openid"
            - "profile"
            - "email"
            - "groups"
    # RBAC Configuration
    rbac:
        # Keycloak group that gets admin access
        admin_group: "polaris_admins"
        # Default role for authenticated users
        default_role: "readonly"
        # Additional RBAC policies (CSV format)
        additional_policies: |
            p, role:developers, applications, *, */*, allow
            p, role:developers, repositories, *, *, allow
            g, polaris_developers, role:developers

# SEALED SECRETS
sealed_secrets:
    # Controller namespace
    namespace: "kube-system"

    # Certificate renewal (days)
    certificate_renewal_days: 30

# OPENEO
openeo:
    # PostgreSQL database
    database:
        name: "postgres"
        username: "postgres"
        password: "CHANGEME"
        size: "8Gi"

    # Redis cache
    redis:
        password: "CHANGEME"
        size: "8Gi"

    # OIDC Configuration
    oidc:
        enabled: true
        url: "https://edp-portal.eurac.edu/auth/realms/edp"
        organization: "eurac-keycloak"
        provider_title: "EURAC Keycloak"

    # API Configuration
    api:
        title: "OpenEO ArgoWorkflows"
        description: "A K8S deployment of the openeo api for argoworkflows."
        url: "http://openeo.10.8.244.214.nip.io/openeo/1.1.0"

    # STAC Catalogue
    stac:
        url: "https://stac.eodc.eu/api/v1"

    # Worker Configuration
    dask:
        worker_cores: "4"
        worker_memory: "8"
        worker_limit: "6"
        cluster_timeout: "3600"

