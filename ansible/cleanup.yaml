# Ansible playbook to clean up Polaris cluster components
#
# This playbook removes:
# - ArgoCD (Helm release, namespace, CRDs, cluster resources)
# - Sealed Secrets (Helm release, CRDs)
# - All ArgoCD Applications across all namespaces
# - Temporary configuration files
#
# This playbook does NOT remove:
# - K3s installation
# - Helm binary
# - CoreDNS configuration
# - System dependencies
#
# To completely remove K3s, run: /usr/local/bin/k3s-uninstall.sh
#
- name: Cleanup previous Polaris deployment
  hosts: polaris
  become: true
  vars:
      PLAYBOOK_VERSION: "1.1"
      kubeconfig_path: /etc/rancher/k3s/k3s.yaml

  tasks:
      - name: Ping the host to check connectivity
        ansible.builtin.ping:

      - name: Print debug message to verify task execution
        ansible.builtin.debug:
            msg: "Goodbye Polaris! Cleanup Playbook version: {{ PLAYBOOK_VERSION }}"

      - name: Get list of application namespaces managed by ArgoCD
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            kubectl get applications.argoproj.io -A -o jsonpath='{range .items[*]}{.spec.destination.namespace}{"\n"}{end}' | sort -u
        register: app_namespaces
        failed_when: false
        changed_when: false

      - name: Display namespaces to be cleaned up
        ansible.builtin.debug:
            msg: "Will clean up these namespaces: {{ app_namespaces.stdout_lines }}"
        when: app_namespaces.stdout_lines | length > 0

      - name: Remove finalizers from all ArgoCD Applications in all namespaces
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            for ns in $(kubectl get namespaces -o name | cut -d/ -f2); do
              for app in $(kubectl get applications.argoproj.io -n $ns -o name 2>/dev/null || true); do
                echo "Removing finalizers from $app in namespace $ns"
                kubectl patch $app -n $ns --type merge -p '{"metadata":{"finalizers":[]}}' || true
              done
            done

      - name: Delete existing ArgoCD Helm release (if exists)
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            helm uninstall argocd --namespace argocd || true

      - name: Remove finalizers from ArgoCD CRDs in argocd namespace
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            for app in $(kubectl get applications.argoproj.io -n argocd -o name 2>/dev/null || true); do
              echo "Removing finalizers from $app"
              kubectl patch $app -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' || true
            done
            for appset in $(kubectl get applicationsets.argoproj.io -n argocd -o name 2>/dev/null || true); do
              echo "Removing finalizers from $appset"
              kubectl patch $appset -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' || true
            done
            for proj in $(kubectl get appprojects.argoproj.io -n argocd -o name 2>/dev/null || true); do
              echo "Removing finalizers from $proj"
              kubectl patch $proj -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' || true
            done

      - name: Delete ArgoCD cluster-scoped resources
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            kubectl delete clusterrole argocd-application-controller --ignore-not-found=true || true
            kubectl delete clusterrole argocd-server --ignore-not-found=true || true
            kubectl delete clusterrole argocd-repo-server --ignore-not-found=true || true
            kubectl delete clusterrolebinding argocd-application-controller --ignore-not-found=true || true
            kubectl delete clusterrolebinding argocd-server --ignore-not-found=true || true
            kubectl delete clusterrolebinding argocd-repo-server --ignore-not-found=true || true
            kubectl get clusterrole -o name | grep argocd | xargs -r kubectl delete || true
            kubectl get clusterrolebinding -o name | grep argocd | xargs -r kubectl delete || true

      - name: Force delete ArgoCD namespace
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            # First try normal delete
            kubectl delete namespace argocd --ignore-not-found=true --timeout=30s || true
            # If it hangs, force delete by removing finalizers
            kubectl patch namespace argocd --type merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true

      - name: Force delete ArgoCD CRDs
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            # Remove finalizers from CRDs first, then delete
            kubectl patch crd applications.argoproj.io --type merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
            kubectl patch crd applicationsets.argoproj.io --type merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
            kubectl patch crd appprojects.argoproj.io --type merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true

            kubectl delete crd applications.argoproj.io --ignore-not-found=true --timeout=30s || true
            kubectl delete crd applicationsets.argoproj.io --ignore-not-found=true --timeout=30s || true
            kubectl delete crd appprojects.argoproj.io --ignore-not-found=true --timeout=30s || true

      - name: Remove existing ArgoCD network policies (if any)
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            kubectl delete networkpolicy --all -n argocd --ignore-not-found=true || true

      - name: Delete Sealed Secrets Helm release (if exists)
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            helm uninstall sealed-secrets --namespace kube-system || true

      - name: Delete Sealed Secrets CRDs
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            kubectl delete crd sealedsecrets.bitnami.com --ignore-not-found=true || true

      - name: Delete all Helm releases in application namespaces
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            for ns in {{ app_namespaces.stdout_lines | join(' ') }}; do
              if kubectl get namespace $ns &>/dev/null; then
                echo "Uninstalling Helm releases in namespace: $ns"
                for release in $(helm list -n $ns -q 2>/dev/null || true); do
                  echo "  Uninstalling release: $release"
                  helm uninstall $release -n $ns --timeout 2m || true
                done
              fi
            done
        when: app_namespaces.stdout_lines | length > 0

      - name: Remove finalizers from all PVCs in application namespaces
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            for ns in {{ app_namespaces.stdout_lines | join(' ') }}; do
              if kubectl get namespace $ns &>/dev/null; then
                echo "Removing PVC finalizers in namespace: $ns"
                for pvc in $(kubectl get pvc -n $ns -o name 2>/dev/null || true); do
                  echo "  Removing finalizers from $pvc"
                  kubectl patch $pvc -n $ns --type merge -p '{"metadata":{"finalizers":[]}}' || true
                done
              fi
            done
        when: app_namespaces.stdout_lines | length > 0

      - name: Delete all PVCs in application namespaces
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            for ns in {{ app_namespaces.stdout_lines | join(' ') }}; do
              if kubectl get namespace $ns &>/dev/null; then
                echo "Deleting PVCs in namespace: $ns"
                kubectl delete pvc --all -n $ns --timeout=60s --ignore-not-found=true || true
              fi
            done
        when: app_namespaces.stdout_lines | length > 0

      - name: Delete all PVs
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            echo "Removing finalizers from all PVs"
            for pv in $(kubectl get pv -o name 2>/dev/null || true); do
              kubectl patch $pv --type merge -p '{"metadata":{"finalizers":[]}}' || true
            done
            echo "Deleting all PVs"
            kubectl delete pv --all --timeout=60s --ignore-not-found=true || true

      - name: Force delete application namespaces
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            for ns in {{ app_namespaces.stdout_lines | join(' ') }}; do
              if kubectl get namespace $ns &>/dev/null; then
                echo "Deleting namespace: $ns"
                kubectl delete namespace $ns --timeout=60s --ignore-not-found=true || true
                # If it hangs, force delete by removing finalizers
                kubectl patch namespace $ns --type merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              fi
            done
        when: app_namespaces.stdout_lines | length > 0

      - name: Wait for application namespaces to be deleted
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            timeout=60
            for ns in {{ app_namespaces.stdout_lines | join(' ') }}; do
              while kubectl get namespace $ns 2>/dev/null && [ $timeout -gt 0 ]; do
                echo "Waiting for namespace $ns to be deleted... ($timeout seconds left)"
                sleep 2
                timeout=$((timeout-2))
              done
            done
        when: app_namespaces.stdout_lines | length > 0

      - name: Clean up temporary files
        ansible.builtin.file:
            path: "{{ item }}"
            state: absent
        loop:
            - /tmp/argocd-values.yaml
            - /tmp/argocd-appproject.yaml
            - /tmp/argocd-application.yaml
            - /tmp/argocd-custom/
            - /tmp/coredns-configmap.yaml
            - /tmp/coredns-configmap-backup.yaml

      - name: Wait for complete ArgoCD cleanup
        ansible.builtin.shell: |
            export KUBECONFIG={{ kubeconfig_path }}
            timeout=30
            while kubectl get namespace argocd 2>/dev/null && [ $timeout -gt 0 ]; do
              echo "Waiting for argocd namespace to be deleted... ($timeout seconds left)"
              sleep 2
              timeout=$((timeout-2))
            done
            timeout=30
            while kubectl get crd applications.argoproj.io 2>/dev/null && [ $timeout -gt 0 ]; do
              echo "Waiting for ArgoCD CRDs to be deleted... ($timeout seconds left)"
              sleep 2
              timeout=$((timeout-2))
            done
            echo "ArgoCD cleanup completed"

      - name: Display cleanup summary
        ansible.builtin.debug:
            msg: |
                Cleanup completed successfully!
                - ArgoCD removed
                - Sealed Secrets removed
                - All application namespaces deleted: {{ app_namespaces.stdout_lines | join(', ') if app_namespaces.stdout_lines | length > 0 else 'none' }}
                - All PVCs and PVs removed
                - All CRDs cleaned up
                - Temporary files removed
                You can now run bootstrap.yaml to reinstall the cluster.
